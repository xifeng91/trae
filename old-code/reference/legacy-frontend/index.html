<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>今日简报 - 每日20条精选新闻</title>
  <meta name="description" content="每天精选20条国内外时事新闻，AI解读帮您3分钟掌握今日世界要点。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 加载动画 -->
  <div id="loading" class="loading-container">
    <div class="loading-spinner"></div>
    <p class="loading-text">正在为您整理今日简报...</p>
  </div>

  <!-- 页面头部 -->
  <header id="header" class="header" style="display:none">
    <h1 class="header-title">
      <span class="accent">📋</span> 今日简报
    </h1>
    <p class="header-subtitle"></p>
    <div class="header-sub">
      <span class="date"></span>
      <span class="dot"></span>
      <button id="refresh-btn" class="update-btn">🔄 刷新</button>
    </div>
  </header>

  <!-- 统计信息 -->
  <div id="stats" class="stats-row" style="display:none"></div>

  <!-- 分类标签 -->
  <nav id="tabs" class="tabs" style="display:none"></nav>

  <!-- 新闻列表 -->
  <main id="news-list" class="news-list" style="display:none"></main>

  <!-- 底部操作区 -->
  <footer id="footer" class="footer-actions" style="display:none">
    <button id="copy-btn" class="copy-btn">
      📋 一键复制全文
    </button>
    <p class="footer-note">
      <span class="update-time"></span>
      <br>
      数据来源：新华社、人民日报、央视新闻、路透社、AP、BBC、Al Jazeera等
    </p>
  </footer>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <!-- 脚本 -->
  <script src="js/newsData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
